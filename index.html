<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Attrape-moi si tu peux</title>
<style>
  :root {
    --ink: #1a1f16;
    --paper: #eef1e6;
    --moss: #4f6b3a;
    --moss-dark: #37502a;
    --alert: #c1502e;
    --line: rgba(26,31,22,0.15);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Courier New', ui-monospace, monospace;
    overflow: hidden;
  }

  .field {
    position: relative;
    width: 100%;
    height: 100%;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 32px 32px;
  }

  .hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 20px 28px;
    z-index: 5;
    pointer-events: none;
  }

  .hud h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  .hud .stats {
    display: flex;
    gap: 22px;
    font-size: 14px;
  }

  .stats span b {
    display: block;
    font-size: 22px;
    line-height: 1.1;
  }

  .stats span {
    text-align: right;
  }

  #target {
    position: absolute;
    padding: 14px 26px;
    background: var(--moss);
    color: var(--paper);
    border: none;
    border-radius: 3px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--moss-dark);
    transition: transform 0.08s ease;
    user-select: none;
  }

  #target:active {
    transform: translate(2px, 2px);
    box-shadow: 1px 1px 0 var(--moss-dark);
  }

  #target.fleeing {
    background: var(--alert);
    box-shadow: 3px 3px 0 #8a3a20;
  }

  .banner {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 18px;
    background: rgba(238,241,230,0.96);
    z-index: 10;
    text-align: center;
  }

  .banner.show { display: flex; }

  .banner p.big {
    font-size: 15px;
    letter-spacing: 0.04em;
    margin: 0;
    text-transform: uppercase;
  }

  .banner p.score {
    font-size: 46px;
    margin: 0;
    font-weight: 700;
  }

  .banner button {
    padding: 12px 30px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 3px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.03em;
  }

  .hint {
    position: absolute;
    bottom: 22px;
    left: 28px;
    font-size: 12px;
    opacity: 0.55;
    z-index: 5;
  }
</style>
</head>
<body>

<div class="field" id="field">
  <div class="hud">
    <h1>Attrape-moi si tu peux</h1>
    <div class="stats">
      <span>Score<b id="score">0</b></span>
      <span>Temps<b id="time">15</b></span>
    </div>
  </div>

  <button id="target">Clique-moi</button>

  <div class="hint">Le bouton s'enfuit à chaque clic. Combien peux-tu en avoir en 15 secondes ?</div>

  <div class="banner" id="banner">
    <p class="big">Temps écoulé</p>
    <p class="score" id="finalScore">0</p>
    <button id="replay">Rejouer</button>
  </div>
</div>

<script>
  const field = document.getElementById('field');
  const target = document.getElementById('target');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const banner = document.getElementById('banner');
  const finalScoreEl = document.getElementById('finalScore');
  const replayBtn = document.getElementById('replay');

  const DURATION = 15;
  let score = 0;
  let timeLeft = DURATION;
  let timer = null;
  let running = false;

  function place(x, y) {
    target.style.left = x + 'px';
    target.style.top = y + 'px';
  }

  function randomPosition() {
    const rect = field.getBoundingClientRect();
    const bw = target.offsetWidth || 140;
    const bh = target.offsetHeight || 48;
    const margin = 12;
    const hudSafe = 90;
    const maxX = Math.max(margin, rect.width - bw - margin);
    const maxY = Math.max(hudSafe, rect.height - bh - margin);
    const x = margin + Math.random() * (maxX - margin);
    const y = hudSafe + Math.random() * (maxY - hudSafe);
    return { x, y };
  }

  function teleport() {
    const { x, y } = randomPosition();
    place(x, y);
  }

  function startGame() {
    score = 0;
    timeLeft = DURATION;
    scoreEl.textContent = score;
    timeEl.textContent = timeLeft;
    banner.classList.remove('show');
    running = true;
    teleport();

    clearInterval(timer);
    timer = setInterval(() => {
      timeLeft--;
      timeEl.textContent = timeLeft;
      if (timeLeft <= 0) endGame();
    }, 1000);
  }

  function endGame() {
    running = false;
    clearInterval(timer);
    finalScoreEl.textContent = score;
    banner.classList.add('show');
  }

  target.addEventListener('click', () => {
    if (!running) return;
    score++;
    scoreEl.textContent = score;
    target.classList.add('fleeing');
    teleport();
    setTimeout(() => target.classList.remove('fleeing'), 120);
  });

  replayBtn.addEventListener('click', startGame);
  window.addEventListener('resize', () => { if (running) teleport(); });

  // premier placement avant le début du jeu
  requestAnimationFrame(() => {
    teleport();
    startGame();
  });
</script>

</body>
</html>
